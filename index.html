<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b14;color:#eef2ff}main{max-width:1050px;margin:auto;padding:28px 18px}.app{height:calc(100vh - 56px);min-height:620px;display:grid;grid-template-columns:230px 1fr;background:#0d1320;border:1px solid #202b40;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px #0008}.side{padding:22px;border-right:1px solid #202b40;background:#0a0f1a}.brand{font-size:22px;font-weight:800;margin-bottom:28px}.brand span{opacity:.6}.new{width:100%;padding:12px;border:1px solid #33415e;border-radius:12px;background:#121a2a;color:#fff;cursor:pointer}.hint{color:#8290aa;font-size:12px;line-height:1.6;margin-top:25px}.chat{display:flex;flex-direction:column;min-width:0}.top{padding:20px 24px;border-bottom:1px solid #202b40;font-weight:700}.top small{display:block;color:#7f8ca5;font-weight:400;margin-top:3px}.messages{flex:1;overflow:auto;padding:26px}.msg{max-width:820px;margin:0 auto 18px;display:flex;gap:12px}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#1a2437;flex:none}.bubble{line-height:1.65;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#18243a;padding:12px 15px;border-radius:15px}.composer{padding:18px 24px 24px;border-top:1px solid #202b40}.box{max-width:820px;margin:auto;display:flex;gap:10px;padding:8px;border:1px solid #33415e;border-radius:16px;background:#0a101c}.box textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:#fff;padding:10px;font:inherit;min-height:46px}.send{width:48px;border:0;border-radius:12px;background:#fff;color:#080b12;font-weight:800;cursor:pointer}.send:disabled{opacity:.5}.status{text-align:center;color:#71809a;font-size:11px;margin-top:8px}@media(max-width:720px){.app{grid-template-columns:1fr;height:calc(100vh - 30px);min-height:650px}.side{display:none}main{padding:15px}.messages{padding:18px}.composer{padding:14px}}
</style></head>
<body><main><section class="app"><aside class="side"><div class="brand">✦ Alpha <span>AI</span></div><button class="new" id="newChat">＋ New chat</button><div class="hint">A clean AI workspace for questions, writing, coding, ideas and everyday help.</div></aside><section class="chat"><header class="top">Alpha AI <small>Smart assistant</small></header><div id="messages" class="messages"><div class="msg"><div class="avatar">✦</div><div class="bubble">Hi! I’m Alpha AI. What can I help you with?</div></div></div><div class="composer"><form class="box" id="form"><textarea id="input" rows="1" placeholder="Message Alpha AI…"></textarea><button class="send" id="send" type="submit">↑</button></form><div class="status" id="status">AI answers may be imperfect. Check important information.</div></div></section></section></main>
<script>
const messagesEl=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),form=document.getElementById('form'),status=document.getElementById('status');let history=[];
function add(text,role){const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'');const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'You':'✦';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);messagesEl.appendChild(row);messagesEl.scrollTop=messagesEl.scrollHeight}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;add(text,'user');history.push({role:'user',content:text});input.value='';send.disabled=true;status.textContent='Alpha AI is thinking…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');add(data.answer,'assistant');history.push({role:'assistant',content:data.answer});status.textContent='Ready'}catch(err){add('I couldn’t connect to the AI service yet. '+err.message,'assistant');status.textContent='Connection error'}finally{send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.getElementById('newChat').onclick=()=>{history=[];messagesEl.innerHTML='';add('Hi! I’m Alpha AI. What can I help you with?','assistant');status.textContent='Ready';input.focus()};
</script></body></html>
